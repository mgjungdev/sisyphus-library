<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Watch</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #74726b; --line: #e3e1da;
  --accent: #2f6fdb; --ok: #1f8a4c; --warn: #b7791f; --bad: #c0392b; --chip: #efede6;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe6; --muted: #9a988f; --line: #2f2e2b;
    --accent: #6d9eff; --ok: #4cc27f; --warn: #e0a84a; --bad: #ff6b5e; --chip: #2a2927; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 system-ui, "Segoe UI", "Malgun Gothic", sans-serif; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
h1 { font-size: 16px; margin: 0; font-weight: 650; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px;
  background: var(--chip); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live .dot { background: var(--ok); animation: pulse 1.4s infinite; }
.paused .dot { background: var(--warn); }
@keyframes pulse { 50% { opacity: .3; } }
.spacer { flex: 1; }
.muted { color: var(--muted); }
select { font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px 20px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
section > h2 { margin: 0; padding: 10px 14px; font-size: 13px; font-weight: 600; letter-spacing: .02em;
  border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
#feed { height: calc(100vh - 250px); min-height: 360px; overflow-y: auto; font-size: 13px; }
.ev { display: grid; grid-template-columns: 62px 130px minmax(0, 1fr); gap: 8px; padding: 5px 14px; border-bottom: 1px solid var(--line); }
.ev .ts { color: var(--muted); font-family: var(--mono); font-size: 12px; }
.ev .who { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .who.coord { color: var(--accent); }
.ev .body { overflow-wrap: anywhere; }
.ev.tool .body { font-family: var(--mono); font-size: 12px; }
.tool-name { font-weight: 600; margin-right: 6px; font-family: var(--mono); }
.ev.error .body { color: var(--bad); }
.ev.agent-done .body { color: var(--ok); }
.ev.text .body { white-space: pre-wrap; }
pre.plain { margin: 0; padding: 12px 14px; font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.final { padding: 12px 14px; border-top: 2px solid var(--ok); white-space: pre-wrap; }
.final.bad { border-color: var(--bad); }
.empty { padding: 20px 14px; color: var(--muted); }
.agents { list-style: none; margin: 0; padding: 6px 0; }
.agents li { display: flex; gap: 8px; align-items: center; padding: 5px 14px; }
.agents .model { margin-left: auto; font-size: 12px; color: var(--muted); }
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); }
.counts div { background: var(--panel); padding: 8px 12px; }
.counts b { display: block; font-size: 18px; }
.counts span { font-size: 12px; color: var(--muted); }
.books { list-style: none; margin: 0; padding: 6px 0; max-height: 320px; overflow-y: auto; }
.books li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 14px; font-size: 13px; }
.stage { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--chip); white-space: nowrap; }
.s-deployed, .s-reviewed { color: var(--ok); }
.s-failing { color: var(--bad); }
.s-unreviewed, .s-no-glossary { color: var(--warn); }
.summary { margin: 0; padding: 8px 14px; font: 12px/1.6 var(--mono); max-height: 260px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header>
  <h1>Pipeline Watch</h1>
  <span id="state" class="pill"><span class="dot"></span><span id="state-text">…</span></span>
  <span class="spacer"></span>
  <label class="muted">run <select id="run"></select></label>
  <span class="muted" id="updated"></span>
</header>
<main>
  <div class="stack">
    <section>
      <h2><span>실시간 진행</span><span class="muted" id="run-meta"></span></h2>
      <div id="feed"></div>
    </section>
  </div>
  <div class="stack">
    <section>
      <h2><span>에이전트</span><span class="muted" id="agent-count"></span></h2>
      <ul class="agents" id="agents"></ul>
    </section>
    <section>
      <h2><span>책 현황</span></h2>
      <div class="counts" id="counts"></div>
      <ul class="books" id="books"></ul>
    </section>
    <section>
      <h2><span>pipeline.log</span></h2>
      <pre class="summary" id="summary"></pre>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let chosen = null, lastRendered = '';

$('run').addEventListener('change', e => { chosen = e.target.selectedIndex === 0 ? null : e.target.value; lastRendered = ''; tick(); });

function renderFeed(d) {
  const feed = $('feed');
  const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
  let html = '';
  if (d.plain !== undefined) {
    html = d.plain.trim() ? `<pre class="plain">${esc(d.plain)}</pre>`
      : '<div class="empty">이 실행은 텍스트 형식 로그라 끝날 때 한 번에 기록됩니다.</div>';
  } else if (!d.run) {
    html = '<div class="empty">실행 기록이 없습니다.</div>';
  } else {
    html = d.events.map(e => {
      if (e.kind === 'raw') return `<div class="ev raw"><span></span><span></span><span class="body muted">${esc(e.text)}</span></div>`;
      const body = e.kind === 'tool' ? `<span class="tool-name">${esc(e.tool)}</span>${esc(e.text)}`
        : e.kind === 'agent-done' ? `✓ 완료: ${esc(e.text)}` : esc(e.text);
      return `<div class="ev ${e.kind}"><span class="ts">${esc(e.ts)}</span>`
        + `<span class="who ${e.who === 'coordinator' ? 'coord' : ''}" title="${esc(e.who)}">${esc(e.who)}</span>`
        + `<span class="body">${body}</span></div>`;
    }).join('') || '<div class="empty">시작하는 중…</div>';
    if (d.final) {
      const f = d.final;
      const meta = [f.minutes && `${f.minutes}분`, f.turns && `${f.turns}턴`, f.cost != null && `$${f.cost.toFixed(2)}`].filter(Boolean).join(' · ');
      html += `<div class="final ${f.ok ? '' : 'bad'}"><b>${f.ok ? '종료' : '오류로 종료'}</b> <span class="muted">${esc(meta)}</span>\n${esc(f.text)}</div>`;
    }
  }
  if (html !== lastRendered) {
    feed.innerHTML = html;
    lastRendered = html;
    if (atBottom) feed.scrollTop = feed.scrollHeight;
  }
}

function render(d) {
  const st = $('state');
  st.className = 'pill ' + (d.running ? 'live' : d.paused ? 'paused' : '');
  $('state-text').textContent = d.running ? `실행 중 · ${d.since} 시작` : d.paused ? '일시정지(PAUSE)' : '대기 중';
  $('updated').textContent = d.now;

  const sel = $('run');
  const opts = ['<option>최신 실행</option>'].concat(d.runs.map(r => `<option ${r === chosen ? 'selected' : ''}>${esc(r)}</option>`)).join('');
  if (sel.dataset.v !== opts) { sel.innerHTML = opts; sel.dataset.v = opts; }

  const w = d.rate && d.rate.unifiedWindows || {};
  const pct = x => x && x.utilization != null ? Math.round(x.utilization * 100) + '%' : '?';
  const rate = d.rate ? ` · 사용량 5시간 ${pct(w.five_hour)} · 7일 ${pct(w.seven_day)}${d.rate.status !== 'allowed' ? ' (' + d.rate.status + ')' : ''}` : '';
  $('run-meta').textContent = d.run ? `${d.run} · ${d.updated} 갱신${rate}` : '';
  renderFeed(d);

  const agents = d.agents || [];
  const active = agents.filter(a => !a.done).length;
  $('agent-count').textContent = agents.length ? `${active} 실행 중 / ${agents.length}` : '';
  $('agents').innerHTML = agents.length ? agents.map(a =>
    `<li><span class="dot" style="background:${a.done ? 'var(--ok)' : 'var(--accent)'}"></span>${esc(a.name)}`
    + `<span class="model">${esc(a.model)} ${esc(a.start)}${a.end ? '–' + esc(a.end) : ''}</span></li>`).join('')
    : '<li class="muted">없음</li>';

  const order = ['deployed', 'reviewed', 'unreviewed', 'failing', 'no-glossary', 'no-source'];
  $('counts').innerHTML = order.map(k => `<div><b class="s-${k}">${d.counts[k] || 0}</b><span>${k}</span></div>`).join('');
  $('books').innerHTML = d.books.filter(b => b.wave).map(b =>
    `<li><span>${esc(b.title)}</span><span class="stage s-${b.stage}">${b.stage}</span></li>`).join('')
    || '<li class="muted">다음 웨이브 없음</li>';

  const sum = $('summary');
  sum.textContent = d.summary.join('\n');
  sum.scrollTop = sum.scrollHeight;
}

async function tick() {
  try {
    const r = await fetch('/api/state' + (chosen ? '?run=' + encodeURIComponent(chosen) : ''));
    render(await r.json());
  } catch (e) {
    $('state-text').textContent = '서버 연결 끊김';
    $('state').className = 'pill';
  }
}
tick();
setInterval(tick, 3000);
</script>
</body>
</html>
