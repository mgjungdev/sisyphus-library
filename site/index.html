<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sisyphus Library</title>
<meta name="description" content="A small library of classic short stories with a tap-to-look-up dictionary.">
<meta name="theme-color" content="#e8eae6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/library.css">
<link rel="stylesheet" href="css/reader.css">
<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/pages.css">
<script>
  try {
    let t = localStorage.getItem('sl.theme');
    t = { light: 'white', sepia: 'paper', dark: 'night' }[t] || t;
    if (t && t !== 'auto') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<header class="topbar" id="topbar">
  <a class="wordmark" href="#/" aria-label="Sisyphus Library — bookshelf">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V5.5A1.5 1.5 0 0 1 5.5 4H8v16M8 20V6h3.5v14M11.5 20V8.2l3.2-.9 3.8 12.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 20h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>Sisyphus Library</span>
  </a>
  <div class="topbar-title" id="topbar-title" aria-live="polite"></div>
  <nav class="topbar-actions">
    <a class="icon-btn" href="#/words" aria-label="Saved words" id="nav-words">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <span class="badge" id="words-count" hidden></span>
    </a>
    <a class="icon-btn" href="#/settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 2.8v2.4M12 18.8v2.4M21.2 12h-2.4M5.2 12H2.8M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7M18.5 18.5l-1.7-1.7M7.2 7.2L5.5 5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </a>
  </nav>
</header>
<main id="view" tabindex="-1"></main>
<div id="flight-layer" aria-hidden="true"></div>
<div id="card-layer"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
