<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sisyphus Library</title>
<meta name="description" content="A small library of classic public-domain fiction, from short stories to novels, with a tap-to-look-up dictionary.">
<meta name="theme-color" content="#e8eae6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">

<link rel="stylesheet" href="css/card.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/graph.css">
<script>
  try {
    let t = localStorage.getItem('sl.theme');
    t = { light: 'white', sepia: 'paper', dark: 'night' }[t] || t;
    if (t && t !== 'auto') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
<header class="topbar" id="topbar">
  <a class="wordmark" href="#/" aria-label="Sisyphus Library — bookshelf">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V5.5A1.5 1.5 0 0 1 5.5 4H8v16M8 20V6h3.5v14M11.5 20V8.2l3.2-.9 3.8 12.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 20h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span>Sisyphus Library</span>
  </a>
  <div class="topbar-title" id="topbar-title" aria-live="polite"></div>
  <nav class="topbar-actions">
    <div class="view-switch" role="group" aria-label="View">
      <span class="view-thumb" aria-hidden="true"></span>
      <a href="#/" data-nav="library" aria-label="Shelves">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V5.5A1.5 1.5 0 0 1 5.5 4H8v16M8 20V6h3.5v14M11.5 20V8.2l3.2-.9 3.8 12.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M3 20h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Shelves</span>
      </a>
      <a href="#/graph" data-nav="graph" aria-label="Graph">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="7" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="6" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="18" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.3 7.4l7.4-.9M7.2 9.1l3.7 6.8M16.9 8.2l-3.8 7.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Graph</span>
      </a>
    </div>
    <a class="icon-btn" href="#/settings" data-nav="settings" aria-label="Settings">

    </a>
  </nav>
</header>
<main id="view" tabindex="-1"></main>
<div id="flight-layer" aria-hidden="true"></div>
<div id="card-layer"></div>
<script src="vendor/force-graph.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
